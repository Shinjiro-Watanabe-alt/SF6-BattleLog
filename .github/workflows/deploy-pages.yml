name: ED分析PWAをGitHub Pagesへ公開

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: GitHub Pagesを設定
        uses: actions/configure-pages@v5

      - name: PWAをアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./

      - name: GitHub Pagesへ公開
        id: deployment
        uses: actions/deploy-pages@v4
